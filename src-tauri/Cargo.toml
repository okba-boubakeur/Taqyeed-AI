[package]
name = "app"
version = "0.1.0"
description = "Taqyeed AI - AI-Powered Meeting Summarizer"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["image-png", "image-ico"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.7.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
msedge-tts = "0.3"
